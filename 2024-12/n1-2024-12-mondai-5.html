<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藍 N1 記憶帳 — 2024/12 問題5</title>
<style>
  :root{
    --bg:#eceef2; --paper:#fff; --ink:#1b232e; --sub:#71787f; --line:#e2e5ea;
    --indigo:#213a6b; --indigoDim:#3a5691; --indigoSoft:#e9edf6;
    --green:#1f8f63; --greenSoft:#e6f4ec; --red:#c1553c; --redSoft:#f8ebe6;
    --amber:#c58a24; --amberSoft:#f8f0dd; --stampNew:#cfd4dc;
    --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","MS Mincho",serif;
    --sans:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--sans);color:var(--ink);
    padding:20px 14px calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto}
  button{font-family:var(--sans);cursor:pointer}
  .serif{font-family:var(--serif)}
  .muted{color:var(--sub)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(20,30,50,.08)}
  .row{display:flex;align-items:center}
  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.fade{animation:none}*{transition:none!important}}

  ruby{ruby-align:center}
  rt{font-family:var(--sans);font-size:.5em;font-weight:400;color:var(--sub);letter-spacing:0}

  .brand{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--indigo);letter-spacing:1px}
  .brand small{font-size:15px;color:var(--sub);font-family:var(--sans);letter-spacing:0}
  .sub13{font-size:13px;color:var(--sub);margin-top:2px}
  .link{background:none;border:none;color:var(--sub);font-size:12px;display:flex;align-items:center;gap:5px;padding:4px}

  .map{padding:18px 18px 16px}
  .map .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .lbl{font-size:13px;color:var(--sub);letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tile{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);
    font-family:var(--serif);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative}
  .tile.done{border-color:var(--indigo);background:var(--indigo);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
  .tile .dot{position:absolute;bottom:4px;width:14px;height:3px;border-radius:2px}
  .bar{height:6px;border-radius:4px;background:var(--indigoSoft);overflow:hidden;margin-top:14px}
  .bar > i{display:block;height:100%;background:var(--indigo);transition:width .5s}
  .legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

  .modes{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .mode{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border-radius:16px;padding:15px 16px;border:none}
  .mode .ic{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;flex-shrink:0}
  .mode .tt{flex:1}
  .mode .tt b{display:block;font-size:16px}
  .mode .tt span{display:block;font-size:12.5px;margin-top:2px}
  .mode.primary{background:var(--indigo);color:#fff;box-shadow:0 2px 8px rgba(33,58,107,.25)}
  .mode.primary .ic{background:rgba(255,255,255,.15)}
  .mode.primary .tt span{color:rgba(255,255,255,.8)}
  .mode.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  .mode.ghost .ic{background:var(--indigoSoft)}
  .mode.ghost .tt span{color:var(--sub)}
  .mode:disabled{opacity:.6;cursor:default}
  .foot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--sub);line-height:1.5}

  .tb{display:flex;align-items:center;justify-content:space-between}
  .chip{font-size:12px;color:var(--indigo);background:var(--indigoSoft);padding:4px 10px;border-radius:20px;font-weight:600}
  .count{font-size:13px;color:var(--sub);min-width:44px;text-align:right}
  .tbbar{height:5px;border-radius:4px;background:var(--indigoSoft);overflow:hidden;margin-top:10px}
  .tbbar > i{display:block;height:100%;background:var(--indigo);transition:width .35s}

  .qcard{padding:22px 20px;margin-top:12px}
  .sent{font-family:var(--serif);font-size:20px;line-height:2.05;color:var(--ink)}
  .hi{color:var(--indigo);font-weight:700;padding:0 1px}
  .blank{display:inline-block;min-width:54px;text-align:center;color:var(--indigoDim);font-weight:700;border-bottom:2px solid var(--indigoDim)}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--paper);
    border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;transition:background .15s,border-color .15s}
  .opt .n{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
    background:var(--indigoSoft);color:var(--indigo);font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px}
  .opt .txt{font-family:var(--serif);font-size:17px;line-height:1.6}
  .opt.correct{background:var(--greenSoft);border-color:var(--green)}
  .opt.wrong{background:var(--redSoft);border-color:var(--red)}
  .opt.dim{opacity:.9}
  .opt.dim .txt{color:var(--sub)}
  .opt.locked{cursor:default}
  .optnote{font-size:12.5px;color:var(--sub);padding:6px 8px 0 46px;line-height:1.5}
  .optnote.bad{color:var(--red)}

  .expl{margin-top:16px;background:var(--indigoSoft);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .expl .rd{font-family:var(--serif);font-size:19px;color:var(--indigo);font-weight:700}
  .expl .mn{font-size:14px;margin-top:4px}
  .expl hr{border:none;border-top:1px solid var(--line);margin:11px 0}
  .expl .ln{font-size:13.5px;line-height:1.62;margin-top:7px}
  .expl .ln b{color:var(--indigo)}
  .cta{margin-top:16px;width:100%;background:var(--indigo);color:#fff;border:none;border-radius:14px;
    padding:14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .cta.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:600}

  .flip{margin-top:12px;perspective:1200px}
  .flip .inner{position:relative;min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .flip.on .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
    background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(20,30,50,.08);
    padding:24px 22px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
  .face.back{transform:rotateY(180deg);background:var(--indigo);border:none}
  .face .kick{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:14px}
  .face .tap{margin-top:16px;font-size:12px;color:var(--sub)}
  .face.back .rd{font-family:var(--serif);font-size:22px;color:#fff;font-weight:700}
  .face.back .mn{font-size:14.5px;color:rgba(255,255,255,.92);margin-top:5px}
  .face.back hr{border:none;border-top:1px solid rgba(255,255,255,.25);margin:12px 0}
  .face.back .ln{font-size:12.5px;color:rgba(255,255,255,.9);line-height:1.55;margin-top:6px}
  .marks{display:flex;gap:10px;margin-top:16px}
  .mark{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px;font-size:15px;font-weight:700}
  .mark.no{background:var(--redSoft);color:var(--red);border:1.5px solid var(--red)}
  .mark.yes{background:var(--greenSoft);color:var(--green);border:1.5px solid var(--green)}

  .done{text-align:center;padding-top:20px}
  .score{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--indigo);margin-top:6px;line-height:1}
  .score small{font-size:26px;color:var(--sub)}
  .wrongbox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:22px;text-align:left}
  .wrongrow{display:flex;align-items:center;gap:10px;font-size:14px}
  .wrongrow .n{width:24px;height:24px;border-radius:7px;background:var(--redSoft);color:var(--red);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script>
/* ============ DATA (2024/12 · 問題5 · Q26–35 · 文法) ============
   type "grammar": câu có （　）, chọn mẫu ngữ pháp. Furigana 漢字[よみ]. \n = xuống dòng (hội thoại). */
var DATA = [
 {id:"q26",no:26,sec:"文法",type:"grammar",
  prompt:"宝[たから]くじ売[う]り場[ば]があるよ、買[か]ってみない？\nどうせ当[あ]たらないんだから、買[か]う（　）無駄[むだ]だったよ。",
  options:[{t:"より",note:"so sánh “hơn” — không hợp"},{t:"のみ",note:"= chỉ (văn viết), không ghép 〜のみ無駄"},{t:"には",note:"“để mà ~” — sai nghĩa"},{t:"だけ"}],correct:3,
  grammar:"〜だけ無駄（だ）",meaning:"làm ~ chỉ tổ phí công",
  pattern:"Động từ thể từ điển ＋ だけ無駄だ = có làm cũng vô ích. 買うだけ無駄 = mua chỉ phí tiền.",
  trans:"“Có quầy vé số kìa, mua thử không?” — “Đằng nào cũng chẳng trúng, mua chỉ tổ phí thôi.”",
  point:"Cụm cố định là 〜だけ無駄. Các trợ từ より/のみ/には đều không tạo nghĩa “chỉ phí công”."},
 {id:"q27",no:27,sec:"文法",type:"grammar",
  prompt:"近年[きんねん]の健康[けんこう]意識[いしき]の高[たか]まり（　）健康[けんこう]食品[しょくひん]は急[きゅう]成長[せいちょう]している。",
  options:[{t:"に次いで",note:"“tiếp sau ~” (thứ tự/xếp hạng) — sai nghĩa"},{t:"にわたって",note:"“suốt, trải dài” (phạm vi thời gian/không gian)"},{t:"を受けて"},{t:"をめぐって",note:"“xoay quanh ~” (chủ đề tranh luận)"}],correct:2,
  grammar:"〜を受けて",meaning:"do/nhờ tiếp nhận tác động của ~ mà…",
  pattern:"Danh từ ＋ を受けて = hứng lấy tác động/xu thế của ~ rồi dẫn tới kết quả. 高まりを受けて = nhờ (ý thức) tăng lên mà…",
  trans:"Nhờ ý thức sức khỏe tăng cao những năm gần đây, thực phẩm chức năng đang tăng trưởng nhanh.",
  point:"Cần quan hệ nguyên nhân–kết quả → を受けて. Ba mẫu kia là thứ tự / phạm vi / chủ đề."},
 {id:"q28",no:28,sec:"文法",type:"grammar",
  prompt:"息子[むすこ]はサッカーの練習[れんしゅう]でよほど疲[つか]れていたのか、家[いえ]に（　）食事[しょくじ]もとらず、寝[ね]てしまった。",
  options:[{t:"帰り次第",note:"“ngay khi về sẽ ~” (dự định, việc chưa xảy ra)"},{t:"帰るなり"},{t:"帰ったなり",note:"sai kết hợp (〜たなり = giữ nguyên trạng thái)"},{t:"帰るとなれば",note:"“nếu định về thì” (giả định) — sai nghĩa"}],correct:1,
  grammar:"動詞辞書形 ＋ なり",meaning:"vừa ~ xong là lập tức (hành động sau bất ngờ)",
  pattern:"V(từ điển) ＋ なり = ngay sau khi ~ thì lập tức…; vế sau thường bất ngờ, cùng một chủ thể. 帰るなり = vừa về đến là…",
  trans:"Có lẽ vì tập bóng quá mệt, thằng bé vừa về đến nhà là chẳng ăn uống gì, ngủ luôn.",
  point:"〜なり tả hành động bất chợt ngay sau đó. 次第 dùng cho việc sẽ làm; となれば là giả định."},
 {id:"q29",no:29,sec:"文法",type:"grammar",
  prompt:"ウェブサイトごとに異[こと]なるパスワードを設定[せってい]するのは面倒[めんどう]だが、第三者[だいさんしゃ]が不正[ふせい]にアクセスされる（　）、やむを得[え]ない。",
  options:[{t:"しかない以上",note:"“một khi chỉ còn cách ~” — sai nghĩa"},{t:"しかない反面",note:"“mặt khác chỉ còn cách” — sai"},{t:"恐れがある以上"},{t:"恐れがある反面",note:"反面 = “mặt trái lại” — không hợp kết luận “đành chịu”"}],correct:2,
  grammar:"〜恐れがある ＋ 以上（は）",meaning:"một khi có nguy cơ ~ thì (đương nhiên phải…)",
  pattern:"恐れがある = có nguy cơ (điều xấu). 〜以上（は）= một khi đã ~ thì tất nhiên… Ghép: có nguy cơ bị truy cập trái phép → đành chấp nhận phiền.",
  trans:"Đặt mật khẩu khác nhau cho từng trang thì phiền, nhưng một khi có nguy cơ bị người khác truy cập trái phép thì cũng đành chịu.",
  point:"Cần “nguy cơ” (恐れがある) + “một khi đã” (以上). 反面 chỉ sự tương phản, không dẫn tới “đành chịu”."},
 {id:"q30",no:30,sec:"文法",type:"grammar",
  prompt:"昨日[きのう]行[い]った美術館[びじゅつかん]は、一日[いちにち]では（　）作品[さくひん]が展示[てんじ]されていた。",
  options:[{t:"見きれないほどの"},{t:"見ずにはいられないほどの",note:"“hấp dẫn đến mức không thể không xem” — sai nghĩa (câu nói về số lượng)"},{t:"見きれないといった",note:"といった không bổ nghĩa số lượng cho 作品 — sai cấu trúc"},{t:"見ずにはいられないといった",note:"sai cả nghĩa lẫn cấu trúc"}],correct:0,
  grammar:"〜きれない ＋ ほどの ＋ 名詞",meaning:"nhiều đến mức không thể ~ hết",
  pattern:"V(ます) ＋ きれない = không ~ hết nổi. 〜ほどの ＋ N = đến mức mà… (bổ nghĩa danh từ). 見きれないほどの作品 = số tác phẩm nhiều đến mức không xem hết.",
  trans:"Bảo tàng hôm qua trưng bày số tác phẩm nhiều đến mức một ngày không xem hết.",
  point:"Câu nói về SỐ LƯỢNG → 見きれない (không xem xuể) + ほどの. 見ずにはいられない = “không thể không xem” (sai nghĩa)."},
 {id:"q31",no:31,sec:"文法",type:"grammar",
  prompt:"引[ひ]っ越[こ]しを控[ひか]えているので、なるべく余計[よけい]な出費[しゅっぴ]を（　）、友人[ゆうじん]に誘[さそ]われたスキー旅行[りょこう]に行[い]くことにした。",
  options:[{t:"押さえたら抑えたで",note:"“hễ kìm được thì cũng…” — sai nghĩa"},{t:"抑えられるものなら",note:"“nếu mà kìm được thì…” — sai nghĩa"},{t:"抑えるには抑えずに",note:"sai cấu trúc (〜には〜 phải lặp cùng dạng)"},{t:"押さえたいところだが"}],correct:3,
  grammar:"〜たいところだが",meaning:"tuy muốn ~ (nhưng thực tế thì ngược lại)",
  pattern:"V(たい) ＋ ところだ = đang muốn / lẽ ra muốn ~; ＋ が = nhưng… Ghép: muốn kìm chi tiêu thừa NHƯNG (vẫn đi trượt tuyết).",
  trans:"Vì sắp chuyển nhà nên đáng lẽ muốn hạn chế chi tiêu, nhưng rồi vẫn quyết đi chuyến trượt tuyết được bạn rủ.",
  point:"Mạch “muốn ~ nhưng…” → たいところだが. たら〜たで / ものなら / には〜ずに đều sai nghĩa hoặc sai cấu trúc."},
 {id:"q32",no:32,sec:"文法",type:"grammar",
  prompt:"驚[おどろ]いたことに、その小学生[しょうがくせい]は、高校[こうこう]レベルの数学[すうがく]の問題[もんだい]をすらすらと（　）。",
  options:[{t:"解けるとは",note:"〜とは = “không ngờ lại ~”, trùng với 驚いたことに → thừa"},{t:"解けるものなら",note:"“nếu giải được thì…” — sai nghĩa"},{t:"解いたまでだ",note:"“chẳng qua chỉ giải thôi” — sai sắc thái"},{t:"解いてみせた"}],correct:3,
  grammar:"〜てみせた",meaning:"đã làm ~ cho thấy (phô diễn năng lực/quyết tâm)",
  pattern:"V(て) ＋ みせる = làm cho (người khác) thấy, thể hiện ra. 解いてみせた = đã giải (ấn tượng) cho thấy.",
  trans:"Đáng kinh ngạc, cậu học sinh tiểu học đó đã giải trơn tru bài toán trình độ cấp 3 (như để chứng tỏ).",
  point:"驚いたことに đã mang nghĩa ngạc nhiên nên 〜とは bị trùng. Câu cần một mệnh đề khẳng định → 解いてみせた."},
 {id:"q33",no:33,sec:"文法",type:"grammar",
  prompt:"専門家[せんもんか]の話[はなし]では、かつてこの地域[ちいき]一帯[いったい]は海[うみ]だった（　）。",
  options:[{t:"という"},{t:"といえる",note:"“có thể nói là” (kết luận của người nói) — không khớp 話では"},{t:"といった",note:"“kiểu như, đại loại” — sai"},{t:"といわれる",note:"“được (người ta) cho là” — thừa vì đã nêu nguồn 専門家の話では"}],correct:0,
  grammar:"〜という（伝聞）",meaning:"nghe nói rằng ~ (dẫn lại thông tin)",
  pattern:"Thể thường ＋ という = truyền đạt/nghe nói. Đi cặp với 「〜の話では」(theo lời ~) → dẫn lại lời chuyên gia.",
  trans:"Theo lời chuyên gia, cả vùng này xưa kia từng là biển.",
  point:"「〜の話では…という」là cặp cố định (truyền văn). といわれる bị thừa vì nguồn đã được nêu rõ."},
 {id:"q34",no:34,sec:"文法",type:"grammar",
  prompt:"子[こ]どもは生[う]まれてくる家庭[かてい]環境[かんきょう]を選[えら]べない。だからこそ、親[おや]の経済[けいざい]状況[じょうきょう]によって、子[こ]どもの教育[きょういく]機会[きかい]が奪[うば]われること（　）。",
  options:[{t:"があるわけではない",note:"“không hẳn là có ~” — trái ý (câu nhấn mạnh “không được phép”)"},{t:"であるわけではない",note:"sai kết hợp (こと + である…) và sai nghĩa"},{t:"があってはならない"},{t:"であってはならない",note:"こと đi với が (ことがあってはならない), không dùng である"}],correct:2,
  grammar:"〜こと ＋ があってはならない",meaning:"không được để xảy ra chuyện ~ (tuyệt đối không được phép)",
  pattern:"N/こと ＋ があってはならない = không được có / không được để xảy ra ~. Ở đây こと(việc) ＋ が ＋ あってはならない.",
  trans:"Trẻ em không được chọn hoàn cảnh gia đình mình sinh ra. Chính vì thế, tuyệt đối không được để cơ hội học tập của trẻ bị tước đoạt bởi hoàn cảnh kinh tế của cha mẹ.",
  point:"だからこそ nhấn mạnh sự cấm đoán → があってはならない. 〜わけではない (“không hẳn”) trái ý cả câu."},
 {id:"q35",no:35,sec:"文法",type:"grammar",
  prompt:"先生[せんせい]「青木[あおき]さん、今度[こんど]の報告誌[ほうこくし]のモデルを青木[あおき]さんにお願[ねが]いできたらと思[おも]うんだけど、どうかな」\n青木[あおき]「やりたいです。でも、私[わたし]（　）」\n先生[せんせい]「もちろん」",
  options:[{t:"だったらいいんですか",note:"“nếu là (tôi) thì được à?” — thiếu sự khiêm nhường"},{t:"なんかでいいんですか",note:"đúng nghĩa nhưng kém dè dặt; với thầy nên dùng でしょうか"},{t:"だったらいいんでしょう",note:"“nếu vậy thì chắc được” — không phải câu hỏi khiêm nhường"},{t:"なんかでいいんでしょうか"}],correct:3,
  grammar:"〜なんかで ＋ いいんでしょうか",meaning:"người/thứ như ~ mà cũng được ạ? (khiêm nhường + hỏi dè dặt)",
  pattern:"Danh từ ＋ なんか = hạ thấp/khiêm nhường “cỡ như ~”; いいんでしょうか = hỏi lịch sự, dè dặt “liệu có được không ạ”. 私なんかでいいんでしょうか = em mà cũng được sao ạ?",
  trans:"Cô: “Aoki à, cô muốn nhờ em làm mẫu cho tập báo cáo lần này, em thấy sao?” — Aoki: “Em muốn làm ạ. Nhưng… người như em mà cũng được ạ?” — Cô: “Tất nhiên rồi.”",
  point:"Aoki khiêm tốn (なんか) và hỏi thầy nên dùng thể dè dặt でしょうか. だったら sai nghĩa; ですか kém khiêm nhường hơn."}
];

var MASTER = 4;

/* ============ STORAGE (localStorage) ============ */
var KEY = "n1-2024-12-mondai-5";
var mem = {};
function loadProgress(cb){
  var p = {};
  try { var raw = localStorage.getItem(KEY); if (raw) p = JSON.parse(raw); }
  catch(e){ p = mem; }
  cb(p || {});
}
function saveProgress(p){
  mem = p;
  try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){}
}

/* ============ STATE ============ */
var S = { prog:{}, view:"home", order:[], pos:0, sel:null, revealed:false, flipped:false, results:[] };
var app = document.getElementById("app");

function nextBox(box, ok){ return ok ? Math.min(5,(box||0)+1) : 1; }
function stampColor(box){ if(!box) return "var(--stampNew)"; if(box>=MASTER) return "var(--indigo)"; if(box===3) return "var(--amber)"; return "var(--red)"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function furi(s){
  s = esc(s);
  return s.replace(/([\u4e00-\u9fff々〆ヶ]+)\[([\u3040-\u30ffー]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>');
}

function updateItem(id, ok){
  var cur = S.prog[id] || {box:0,seen:0,correct:0,wrong:0};
  S.prog[id] = { box: nextBox(cur.box,ok), seen:cur.seen+1, correct:cur.correct+(ok?1:0), wrong:cur.wrong+(ok?0:1) };
  saveProgress(S.prog);
}
function mastered(){ var n=0; DATA.forEach(function(d){ if(((S.prog[d.id]&&S.prog[d.id].box)||0)>=MASTER) n++; }); return n; }
function weakIdx(){ var r=[]; DATA.forEach(function(d,i){ if(((S.prog[d.id]&&S.prog[d.id].box)||0)<MASTER) r.push(i); }); return r; }

/* ============ ICONS ============ */
var IC = {
  check:function(c){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';},
  x:function(c){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';},
  back:function(c){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';},
  fwd:function(c){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';},
  reset:function(c){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';},
  quiz:function(c){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';},
  cards:function(c){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="16" rx="2"/><path d="M7 5V3.5A1.5 1.5 0 0 1 8.5 2H19a2 2 0 0 1 2 2v13"/></svg>';},
  focus:function(c){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>';}
};

/* ============ SENTENCE (grammar fill) ============ */
function sentenceHTML(item, variant){
  var parts = (item.prompt||"").split("（　）");
  var mid = (variant==="flash")
    ? '<span class="hi">'+esc("【"+item.options[item.correct].t+"】")+'</span>'
    : '<span class="blank">（　）</span>';
  var html = '<span class="sent">'+furi(parts[0]||"")+mid+furi(parts[1]||"")+'</span>';
  return html.replace(/\n/g,'<br>');
}

/* ============ RENDER: HOME ============ */
function renderHome(){
  var m = mastered(), weak = weakIdx(), pct = Math.round(m/DATA.length*100);
  var tiles = DATA.map(function(d,i){
    var box = (S.prog[d.id]&&S.prog[d.id].box)||0, done = box>=MASTER, c = stampColor(box);
    var dot = (!done && box>0) ? '<span class="dot" style="background:'+c+'"></span>' : '';
    var style = done ? '' : ('color:'+c);
    return '<button class="tile'+(done?' done':'')+'" data-tile="'+i+'" style="'+style+'">'+d.no+dot+'</button>';
  }).join("");
  var focusEnabled = weak.length>0;
  app.innerHTML =
   '<div class="fade">'+
    '<div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:18px">'+
      '<div><div class="brand">藍 <small>N1 記憶帳</small></div>'+
      '<div class="sub13">2024/12 · 問題5 · 文法 (Q26–35)</div></div>'+
      '<button class="link" data-act="reset" title="Xóa tiến độ">'+IC.reset("#71787f")+' Đặt lại</button>'+
    '</div>'+
    '<div class="card map">'+
      '<div class="top"><span class="lbl">BẢN ĐỒ TRÍ NHỚ</span>'+
        '<span style="font-size:13px"><b style="color:var(--indigo);font-size:16px">'+m+'</b> / '+DATA.length+' đã thuộc</span></div>'+
      '<div class="grid">'+tiles+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="legend">'+
        '<span><i class="sw" style="background:var(--stampNew)"></i>Chưa học</span>'+
        '<span><i class="sw" style="background:var(--red)"></i>Còn yếu</span>'+
        '<span><i class="sw" style="background:var(--amber)"></i>Gần thuộc</span>'+
        '<span><i class="sw" style="background:var(--indigo)"></i>Đã thuộc</span>'+
      '</div>'+
    '</div>'+
    '<div class="modes">'+
      modeBtn("primary","quiz",IC.quiz("#fff"),"Luyện đề","Làm 10 câu như thi thật, chấm + phân tích ngay",false)+
      modeBtn("ghost","flash",IC.cards("#213a6b"),"Lật thẻ","Ôn nhanh 10 mẫu ngữ pháp bằng flashcard",false)+
      modeBtn("ghost","focus",IC.focus(focusEnabled?"#c1553c":"#71787f"),
        focusEnabled?("Ôn câu yếu ("+weak.length+")"):"Ôn câu yếu",
        focusEnabled?"Chỉ lật lại những mẫu bạn chưa chắc":"Tuyệt vời — chưa có mẫu nào cần ôn thêm",
        !focusEnabled)+
    '</div>'+
    '<div class="foot">Tiến độ được lưu tự động. Chạm một ô trên bản đồ để ôn riêng câu đó.</div>'+
   '</div>';

  app.querySelectorAll("[data-tile]").forEach(function(b){
    b.addEventListener("click",function(){ startFlash([parseInt(b.getAttribute("data-tile"),10)]); });
  });
  bind("[data-act=reset]", function(){
    if (typeof window!=="undefined" && window.confirm && !window.confirm("Xóa toàn bộ tiến độ đã lưu?")) return;
    S.prog={}; saveProgress({}); renderHome();
  });
  bind("[data-mode=quiz]", startQuiz);
  bind("[data-mode=flash]", function(){ startFlash(DATA.map(function(_,i){return i;})); });
  var fb = app.querySelector("[data-mode=focus]");
  if (fb && focusEnabled) fb.addEventListener("click", function(){ startFlash(weak); });
}
function modeBtn(kind,mode,icon,title,sub,disabled){
  var ig = kind==="primary"?"rgba(255,255,255,.85)":"#213a6b";
  var arrow = disabled?"":IC.fwd(ig);
  return '<button class="mode '+kind+'" data-mode="'+mode+'"'+(disabled?" disabled":"")+'>'+
    '<span class="ic">'+icon+'</span>'+
    '<span class="tt"><b>'+title+'</b><span>'+sub+'</span></span>'+arrow+'</button>';
}

/* ============ RENDER: QUIZ ============ */
function renderQuiz(){
  var item = DATA[S.order[S.pos]];
  var pct = Math.round((S.pos + (S.revealed?1:0))/S.order.length*100);
  var opts = item.options.map(function(o,i){
    var cls="opt", noteHTML="";
    if(S.revealed){
      cls+=" locked";
      if(i===item.correct){ cls+=" correct"; }
      else if(i===S.sel){ cls+=" wrong"; if(o.note) noteHTML='<div class="optnote bad">'+esc(o.note)+'</div>'; }
      else { cls+=" dim"; if(o.note) noteHTML='<div class="optnote">'+esc(o.note)+'</div>'; }
    }
    var nbadge = (S.revealed && i===item.correct) ? IC.check("#1f8f63")
               : (S.revealed && i===S.sel) ? IC.x("#c1553c")
               : (i+1);
    var nStyle = (S.revealed && (i===item.correct||i===S.sel)) ? "background:transparent" : "";
    return '<div><button class="'+cls+'" data-opt="'+i+'"'+(S.revealed?" disabled":"")+'>'+
      '<span class="n" style="'+nStyle+'">'+nbadge+'</span>'+
      '<span class="txt">'+esc(o.t)+'</span></button>'+noteHTML+'</div>';
  }).join("");

  var expl = S.revealed ? (
    '<div class="expl fade"><div class="rd">'+esc(item.grammar)+'</div>'+
    '<div class="mn">'+esc(item.meaning)+'</div><hr>'+
    '<div class="ln"><b>Cấu trúc · </b>'+esc(item.pattern)+'</div>'+
    '<div class="ln"><b>Dịch · </b>'+esc(item.trans)+'</div>'+
    '<div class="ln"><b>Mấu chốt · </b>'+esc(item.point)+'</div></div>'+
    '<button class="cta" data-act="next">'+(S.pos+1>=S.order.length?"Xem kết quả":"Câu tiếp theo")+' '+IC.fwd("#fff")+'</button>'
  ) : "";

  app.innerHTML = '<div class="fade">'+topbar(item.sec,S.pos,S.order.length,pct)+
    '<div class="card qcard">'+sentenceHTML(item,"quiz")+'</div>'+
    '<div class="opts">'+opts+'</div>'+expl+'</div>';

  bind("[data-act=exit]", goHome);
  if(!S.revealed){
    app.querySelectorAll("[data-opt]").forEach(function(b){
      b.addEventListener("click",function(){ answer(parseInt(b.getAttribute("data-opt"),10)); });
    });
  }
  bind("[data-act=next]", nextQuiz);
}

/* ============ RENDER: FLASH ============ */
function renderFlash(){
  var item = DATA[S.order[S.pos]];
  var pct = Math.round(S.pos/S.order.length*100);
  app.innerHTML = '<div class="fade">'+topbar(item.sec,S.pos,S.order.length,pct)+
    '<div class="flip'+(S.flipped?" on":"")+'" data-act="flip"><div class="inner">'+
      '<div class="face front"><div class="kick">CHỌN MẪU ĐÚNG · Câu '+item.no+'</div>'+
        sentenceHTML(item,"flash")+'<div class="tap">Chạm để lật ↺</div></div>'+
      '<div class="face back"><div class="rd">'+esc(item.grammar)+'</div>'+
        '<div class="mn">'+esc(item.meaning)+'</div><hr>'+
        '<div class="ln"><b>Cấu trúc:</b> '+esc(item.pattern)+'</div>'+
        '<div class="ln"><b>Dịch:</b> '+esc(item.trans)+'</div>'+
        '<div class="ln">'+esc(item.point)+'</div></div>'+
    '</div></div>'+
    '<div class="marks">'+
      '<button class="mark no" data-mark="0">'+IC.x("#c1553c")+' Chưa nhớ</button>'+
      '<button class="mark yes" data-mark="1">'+IC.check("#1f8f63")+' Đã nhớ</button>'+
    '</div>'+
    '<div class="foot">"Chưa nhớ" đưa câu về đầu hàng ôn; "Đã nhớ" nâng câu lên gần mức thuộc.</div>'+
   '</div>';

  bind("[data-act=exit]", goHome);
  bind("[data-act=flip]", function(){ S.flipped=!S.flipped; app.querySelector(".flip").classList.toggle("on",S.flipped); });
  app.querySelectorAll("[data-mark]").forEach(function(b){
    b.addEventListener("click",function(e){ e.stopPropagation(); markFlash(b.getAttribute("data-mark")==="1"); });
  });
}

/* ============ RENDER: DONE ============ */
function renderDone(){
  var ok = S.results.filter(function(r){return r.ok;}).length;
  var wrong = S.results.filter(function(r){return !r.ok;});
  var pct = Math.round(ok/S.results.length*100);
  var wrongHTML;
  if(wrong.length===0){
    wrongHTML = '<div style="color:var(--green);font-weight:700;text-align:center">Trọn vẹn — không sai câu nào! 🎯</div>';
  } else {
    wrongHTML = '<div style="font-size:13px;color:var(--sub);margin-bottom:10px">Cần ôn lại '+wrong.length+' câu:</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+
      wrong.map(function(r){ var it=DATA[r.idx];
        return '<div class="wrongrow"><span class="n">'+it.no+'</span>'+
          '<span class="serif">'+esc(it.grammar)+'</span>'+
          '<span style="color:var(--sub);font-size:12.5px">· '+esc(it.meaning)+'</span></div>';
      }).join("")+'</div>';
  }
  app.innerHTML = '<div class="done fade">'+
    '<div class="lbl" style="letter-spacing:1px">KẾT QUẢ LUYỆN ĐỀ</div>'+
    '<div class="score">'+ok+'<small>/'+S.results.length+'</small></div>'+
    '<div class="muted" style="font-size:14px;margin-top:4px">đúng '+pct+'%</div>'+
    '<div class="wrongbox">'+wrongHTML+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">'+
      (wrong.length>0?'<button class="cta" data-act="review">Lật thẻ ôn '+wrong.length+' câu sai</button>':'')+
      '<button class="cta ghost" data-act="home">Về trang chủ</button>'+
    '</div></div>';
  bind("[data-act=review]", function(){ var w=S.results.filter(function(r){return !r.ok;}).map(function(r){return r.idx;}); startFlash(w.length?w:DATA.map(function(_,i){return i;})); });
  bind("[data-act=home]", goHome);
}

/* ============ SHARED ============ */
function topbar(sec,pos,total,pct){
  return '<div class="tb"><button class="link" data-act="exit">'+IC.back("#71787f")+' Thoát</button>'+
    '<span class="chip">問題 '+sec+'</span>'+
    '<span class="count">'+(pos+1)+' / '+total+'</span></div>'+
    '<div class="tbbar"><i style="width:'+pct+'%"></i></div>';
}
function bind(sel, fn){ var el=app.querySelector(sel); if(el) el.addEventListener("click",fn); }

/* ============ ACTIONS ============ */
function goHome(){ S.view="home"; renderHome(); }
function startQuiz(){ S.order=DATA.map(function(_,i){return i;}); S.pos=0; S.sel=null; S.revealed=false; S.results=[]; S.view="quiz"; renderQuiz(); }
function startFlash(idxs){ S.order=(idxs&&idxs.length)?idxs:DATA.map(function(_,i){return i;}); S.pos=0; S.flipped=false; S.view="flash"; renderFlash(); }
function answer(i){
  if(S.revealed) return;
  var item=DATA[S.order[S.pos]]; var ok=(i===item.correct);
  S.sel=i; S.revealed=true; updateItem(item.id,ok); S.results.push({idx:S.order[S.pos],ok:ok});
  renderQuiz();
}
function nextQuiz(){
  if(S.pos+1>=S.order.length){ S.view="done"; renderDone(); return; }
  S.pos++; S.sel=null; S.revealed=false; renderQuiz();
}
function markFlash(ok){
  var item=DATA[S.order[S.pos]]; updateItem(item.id,ok);
  if(S.pos+1>=S.order.length){ goHome(); return; }
  S.pos++; S.flipped=false; renderFlash();
}

/* ============ BOOT ============ */
loadProgress(function(p){ S.prog=p||{}; if(typeof location!=="undefined" && location.hash.indexOf("focus")>=0){ var w=weakIdx(); if(w.length){ startFlash(w); return; } } renderHome(); });
</script>
</body>
</html>
